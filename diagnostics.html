<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ヤシマウマ動作診断</title>
<style>
body { margin: 16px; font: 16px/1.6 sans-serif; color: #222; }
main { max-width: 48em; margin: auto; }
iframe { display: block; width: 100%; height: 225px; border: 0; background: #f2f2f2; }
pre { white-space: pre-wrap; overflow-wrap: break-word; word-wrap: break-word; padding: 12px; background: #f2f2f2; }
</style>
</head>
<body>
<main>
<h1>ヤシマウマ動作診断</h1>
<p>プレビューを表示したまま数秒待ち、止まっている場合は下の診断結果をコピーしてください。</p>
<iframe id="preview" src="index.html?ym-diagnostic=1" title="ヤシマウマ歩行プレビュー"></iframe>
<p><a href="index.html">再生ページを直接開く</a></p>
<pre id="result">診断スクリプトの実行待ち</pre>
<noscript>JavaScript が無効です。</noscript>
</main>
<script>
(function () {
  var preview = document.getElementById('preview');
  var result = document.getElementById('result');
  var lastCount = -1;
  var lastProgress = Date.now();

  function inspect() {
    var rows = ['ブラウザ ' + navigator.userAgent,
      '表示状態 ' + (document.visibilityState || '取得不可'),
      '画面内の表示領域 ' + document.documentElement.clientWidth + ' × ' +
        document.documentElement.clientHeight + ' px'];
    try {
      var doc = preview.contentWindow.document;
      var stage = doc.querySelector('.ym-stage');
      if (!stage) {
        rows.push('状態 プレビューの読み込み待ち。長く続く場合は index.html の配置を確認してください。');
      } else {
        var win = preview.contentWindow;
        var error = stage.getAttribute('data-ym-error');
        var api = stage.ym;
        var plan = api && api.plan;
        var status = api && api.status();
        rows.push('iframe 表示状態 ' + (doc.visibilityState || '取得不可'));
        rows.push('ステージ幅 ' + stage.clientWidth + ' px');
        rows.push('API rAF=' + typeof win.requestAnimationFrame +
          ', ResizeObserver=' + typeof win.ResizeObserver + ', matchMedia=' + typeof win.matchMedia);
        if (status) {
          if (lastCount !== status.painted) {
            lastCount = status.painted;
            lastProgress = Date.now();
          }
          var state = error ? 'エラー' : status.reduced ? '動きの抑制設定を適用中' :
            doc.hidden ? '非表示のため一時停止' :
            !plan.width ? 'レイアウト計測待ち' :
            Date.now() - lastProgress > 2500 ? '描画の進行を検出できません' :
            status.painted ? '描画フレームを検出' : '最初の描画待ち';
          rows.push('状態 ' + state);
          rows.push('モード ' + stage.getAttribute('data-mode') + ' / 方向 ' + stage.getAttribute('data-direction'));
          rows.push('描画方式 ' + status.scheduler + ' / 次フレーム予約 ' + (status.pending ? 'あり' : 'なし'));
          rows.push('サイズ監視 ' + status.resize + ' / SVG 幅 ' + (plan.horse || 0) + ' px');
          rows.push('描画回数 ' + status.painted + ' / 経過 ' + status.elapsed.toFixed(2) + ' 秒');
          rows.push('横位置 ' + (status.left === undefined ? '未設定' : status.left.toFixed(2) + ' px') + ' / ' + status.positioning);
        } else {
          rows.push('状態 ' + (error ? '初期化エラー' : '初期化を検出できません'));
        }
        rows.push('記録したエラー ' + (error || 'なし'));
      }
    } catch (error) {
      rows.push('iframe の状態を取得できません。同じ配信元に両方の HTML を配置してください。');
      rows.push(String(error));
    }
    result.textContent = rows.join('\n');
  }

  preview.addEventListener('load', inspect);
  window.setInterval(inspect, 500);
  inspect();
})();
</script>
</body>
</html>
