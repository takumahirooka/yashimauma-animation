        var offset = entry ? plan.end + phase - 1 : phase;
        var touch = Math.floor(q - offset + 1e-9) + offset;
        var age = q - touch;
        var swing = clamp((age - stance) / (1 - stance));
        var from = anchor(touch);
        var to = anchor(touch + 1);
        var world = mix(from, to, ease(swing));
        var height = Math.min(1, Math.abs(to - from) / stride);
        // Rise a little sooner in swing, then lower into the next foothold.
        var lift = clearance * Math.pow(Math.sin(Math.PI * Math.pow(swing, .85)), 2) * height;
        var roll = .005 * lift * Math.cos(Math.PI * swing);
        return { dx: position - world, lift: lift, roll: roll, planted: age <= stance || from === to };
      });

      // The SVG faces left in its source coordinates. Mirroring the rendered
      // stage changes the direction without redrawing facial features.
      var forwardLeft = neutral ? plan.park : plan.start + position * plan.scale;
      var left = neutral || plan.direction === 1 ? forwardLeft : plan.width - plan.horse - forwardLeft;
      var offset = left.toFixed(4) + 'px';
      if (useTransform) {
        var transform = 'translateX(' + offset + ')';
        if (!neutral && plan.direction === 1) transform += ' scaleX(-1)';
        svg.style.webkitTransform = transform;
        svg.style.transform = transform;
      } else {
        svg.style.left = offset;
        if (!neutral && plan.direction === 1) model.setAttribute('transform', 'translate(343.7446 0) scale(-1 1)');
        else model.removeAttribute('transform');
      }
      paintedLeft = left;
      if (neutral) {
        original.removeAttribute('display');
        model.setAttribute('display', 'none');
        return { left: left, feet: feet, position: position };
      }
      original.setAttribute('display', 'none');
      model.removeAttribute('display');

      function deform(x, y, leg) {
        var rootWeight = 1;
        if (leg < 0) {
          leg = x < 164 ? 0 : x < 244 ? 1 : 3;
          // Keep the white belly and both dark contours on the torso.
          // Blend the inner edges into the lower legs while keeping the belly fixed.
          if (leg === 1) {
            var edge = 230 + 14 * ease((y - 201.5) / 18.5);
            rootWeight = ease((edge - x) / 16);
            var innerEdge = ease((x - 223.3) / 6.7);
            var lowerLeg = ease((y - 198) / 14);
            rootWeight = mix(rootWeight, 1, lowerLeg * (1 - innerEdge * (1 - ease((y - 202) / 5))));
          } else if (leg === 3) {
            var edge = 265.4 - 18 * ease((y - 201.5) / 18.5);
            rootWeight = ease((x - edge) / 24);
            var innerEdge = 1 - ease((x - 265.4) / 1.3);
            var lowerLeg = ease((y - 192) / 27);
            rootWeight = mix(rootWeight, 1, lowerLeg * (1 - innerEdge * (1 - ease((y - 202) / 5))));
          }
        }
        var foot = feet[leg];
        var limb = limbs[leg];
        var ankle = leg === 2 ? 207 : 220.29;
        var legWeight = ease((y - limb.hip) / (ankle - limb.hip));
        var weight = rootWeight * legWeight;
        var bend = 4 * weight * (1 - legWeight) * foot.lift * limb.flex;
        var hoofWeight = rootWeight * ease((y - 207) / 13);
        // Pitch only the airborne hoof. Planted tread points translate rigidly.
        var pitchY = (x - limb.sole) * foot.roll * hoofWeight;
        var pitchX = (ground - y) * foot.roll * hoofWeight;
        var angle = nod * (1 - ease((x - 139) / 57)) * (1 - ease((y - 111) / 71));
        var swing = tail * ease((x - 287) / 31) * (1 - ease((y - 105) / 22));
        // Soft weights blend the neck and tail joins into the untouched torso.
        var angleX = Math.cos(angle) - 1;
        var angleY = Math.sin(angle);
        var tailX = Math.cos(swing) - 1;
        var tailY = Math.sin(swing);
        return [
          x + weight * foot.dx + bend + pitchX + (x - 146) * angleX - (y - 105) * angleY +
            (x - 306) * tailX - (y - 123) * tailY,
          y + (1 - weight) * bounce - weight * foot.lift + pitchY +
            (x - 146) * angleY + (y - 105) * angleX + (x - 306) * tailY + (y - 123) * tailX
        ];
      }

      for (var i = 0; i < rig.length; i++) {
        var leg = rig[i][0];
        var commands = rig[i][1];
        var d = '';
        for (var k = 0; k < commands.length; k++) {
          var command = commands[k];
          d += command[0];
          for (var j = 1; j < command.length; j += 2) {
            var point = deform(command[j], command[j + 1], leg);
            d += point[0].toFixed(2) + ' ' + point[1].toFixed(2) + ' ';
          }
        }
        paths[i].setAttribute('d', d);
      }
      return {
        left: left, feet: feet, position: position, ground: ground, finished: finished,
        soles: limbs.map(function (limb, index) { return deform(limb.sole, ground, index); })
      };
    }

    function layout() {
      var width = stage.clientWidth;
      var rect = svg.getBoundingClientRect();
      var horse = rect.width === undefined ? rect.right - rect.left : rect.width;
      if (!width || !horse) {
        metrics = undefined;
        previous = undefined;
        return;
      }
      // Match the original container-width sizing on engines without cqw.
      if (!(window.CSS && CSS.supports && CSS.supports('width', '1cqw'))) {
        stage.style.height = Math.max(135, Math.min(225, .46 * width + 16)) + 'px';
      }
      var scale = horse / 343.7446;
      var stopAttribute = stage.getAttribute('data-stop');
      var stop = stopAttribute === null ? 18 : Number(stopAttribute);
      var park = Math.max(6, (width - horse) * (isFinite(stop) ? clamp(stop / 100) : .18));
      // Tail plus stride clearance keeps the A wrap outside the viewport.
      var start = -horse - 12;
      var total = (park - start) / scale;
      var end = entry ? total / stride + .56 : Infinity;
      var duration = (width + 12 - start) / (scale * stride) * period;
      metrics = {
        width: width, horse: horse, park: park, scale: scale, start: start,
        total: total, end: end, duration: duration, direction: direction(), stride: stride
      };
      if (reduced()) render(elapsed, true);
    }

    function frame(now) {
      raf = undefined;
      if (!document.documentElement.contains(stage) || reduced() || document.hidden) return;
      try {
        if ((!observer || !metrics) && (lastMeasure === undefined || now - lastMeasure >= 250)) {
          layout();
          lastMeasure = now;
        }
        if (metrics) {
          if (previous !== undefined) elapsed += Math.max(0, Math.min(.25, (now - previous) / 1000));
          previous = now;
          var idle = entry && elapsed > metrics.end * period;
          if (!idle || lastPaint === undefined || now - lastPaint >= 32) {
            render(elapsed);
            lastPaint = now;
            painted++;
          }
        }
        raf = schedule(frame);
      } catch (error) {
        report(stage, error);
      }
    }

    function refresh() {
      if (stage.hasAttribute('data-ym-error')) return;
      try { layout(); } catch (error) {
        cancel(raf);
        raf = undefined;
        report(stage, error);
      }
    }

    function start() {
      cancel(raf);
      raf = previous = lastPaint = lastMeasure = undefined;
      stage.removeAttribute('data-ym-error');
      if (useTransform) svg.style.left = '0';
      refresh();
      if (!stage.hasAttribute('data-ym-error') && !reduced() && !document.hidden) raf = schedule(frame);
    }

    if (typeof window.ResizeObserver === 'function') {
      observer = new window.ResizeObserver(refresh);
      observer.observe(stage);
    }
    window.addEventListener('resize', refresh);
    if (motion && typeof motion.addEventListener === 'function') motion.addEventListener('change', start);
    else if (motion && typeof motion.addListener === 'function') motion.addListener(start);
    document.addEventListener('visibilitychange', start);
    stage.ym = {
      replay: function () { elapsed = 0; start(); },
      reverse: function () {
        stage.setAttribute('data-direction', direction() === 1 ? 'left' : 'right');
        elapsed = 0;
        start();
      },
      // Used by the offline frame inspection and preview generator.
      seek: function (time) {
        cancel(raf);
        raf = undefined;
        elapsed = time;
        if (metrics) return render(time, reduced());
      },
      get plan() {
        var copy = {};
        for (var key in metrics) {
          if (Object.prototype.hasOwnProperty.call(metrics, key)) copy[key] = metrics[key];
        }
        return copy;
      },
      status: function () {
        return {
          scheduler: useRAF ? 'requestAnimationFrame' : 'setTimeout',
          resize: observer ? 'ResizeObserver' : 'resize / polling',
          reduced: reduced(), pending: raf !== undefined, painted: painted, elapsed: elapsed,
          left: paintedLeft, positioning: useTransform ? 'transform' : 'left'
        };
      }
    };
    start();
  }

  function initialize() {
    var stages = document.querySelectorAll('.ym-stage');
    for (var i = 0; i < stages.length; i++) {
      try { mount(stages[i]); } catch (error) { report(stages[i], error); }
    }
  }

  // Also handle insertion while an embed document is still being parsed.
  initialize();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initialize);
})();
</script>
